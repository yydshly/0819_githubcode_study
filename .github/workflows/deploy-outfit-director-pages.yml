name: Deploy research labs

on:
  push:
    branches:
      - main
    paths:
      - "demos/research-hub/**"
      - "demos/outfit-director/**"
      - "demos/punk-skill/**"
      - "demos/xianxia-visual-director/**"
      - "demos/snakey-locomotion/**"
      - "demos/lineworld-night-hunt/**"
      - "demos/bigpeng-hot-gzh/**"
      - "demos/srt-whiteboard-animation/**"
      - "demos/blobatar/**"
      - "studies/outfit-director/**"
      - "studies/punk-skill/**"
      - "studies/xianxia-visual-director/**"
      - "studies/snakey-locomotion/**"
      - "studies/lineworld/**"
      - "studies/bigpeng-hot-gzh/**"
      - "studies/srt-whiteboard-animation/**"
      - "studies/blobatar/**"
      - ".github/workflows/deploy-outfit-director-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            demos/snakey-locomotion/package-lock.json
            demos/lineworld-night-hunt/package-lock.json

      - name: Build Snakey Locomotion research lab
        run: |
          npm ci --prefix demos/snakey-locomotion
          npm run build --prefix demos/snakey-locomotion

      - name: Verify and build Lineworld Night Hunt
        run: |
          npm ci --prefix demos/lineworld-night-hunt
          npm run test:ai --prefix demos/lineworld-night-hunt
          npm run typecheck --prefix demos/lineworld-night-hunt
          npm run build --prefix demos/lineworld-night-hunt

      - name: Assemble research labs site
        run: |
          mkdir -p _site/outfit-director
          mkdir -p _site/punk-skill
          mkdir -p _site/xianxia-visual-director
          mkdir -p _site/snakey-locomotion
          mkdir -p _site/lineworld-night-hunt
          mkdir -p _site/bigpeng-hot-gzh
          mkdir -p _site/srt-whiteboard-animation
          mkdir -p _site/blobatar
          mkdir -p _site/studies/outfit-director
          mkdir -p _site/studies/punk-skill
          mkdir -p _site/studies/xianxia-visual-director
          mkdir -p _site/studies/snakey-locomotion
          mkdir -p _site/studies/lineworld
          mkdir -p _site/studies/bigpeng-hot-gzh
          mkdir -p _site/studies/srt-whiteboard-animation
          mkdir -p _site/studies/blobatar
          cp -a demos/research-hub/. _site/
          cp -a demos/outfit-director/. _site/outfit-director/
          cp -a demos/punk-skill/. _site/punk-skill/
          cp -a demos/xianxia-visual-director/. _site/xianxia-visual-director/
          cp -a demos/snakey-locomotion/dist/. _site/snakey-locomotion/
          cp -a demos/lineworld-night-hunt/dist/. _site/lineworld-night-hunt/
          mkdir -p _site/lineworld-night-hunt/test-artifacts
          cp demos/lineworld-night-hunt/test-artifacts/tutorial-desktop.png _site/lineworld-night-hunt/test-artifacts/tutorial-desktop.png
          cp -a demos/bigpeng-hot-gzh/. _site/bigpeng-hot-gzh/
          cp -a demos/srt-whiteboard-animation/. _site/srt-whiteboard-animation/
          cp -a demos/blobatar/. _site/blobatar/
          cp -a studies/outfit-director/. _site/studies/outfit-director/
          cp -a studies/punk-skill/. _site/studies/punk-skill/
          cp -a studies/xianxia-visual-director/. _site/studies/xianxia-visual-director/
          cp -a studies/snakey-locomotion/. _site/studies/snakey-locomotion/
          cp -a studies/lineworld/. _site/studies/lineworld/
          cp -a studies/bigpeng-hot-gzh/. _site/studies/bigpeng-hot-gzh/
          cp -a studies/srt-whiteboard-animation/. _site/studies/srt-whiteboard-animation/
          cp -a studies/blobatar/. _site/studies/blobatar/
          sed -i 's#../../studies/outfit-director/#../studies/outfit-director/#g' _site/outfit-director/index.html
          sed -i 's#../../studies/punk-skill/#../studies/punk-skill/#g' _site/punk-skill/index.html
          sed -i 's#../../studies/xianxia-visual-director/#../studies/xianxia-visual-director/#g' _site/xianxia-visual-director/index.html
          sed -i 's#../../studies/snakey-locomotion/#../studies/snakey-locomotion/#g' _site/snakey-locomotion/index.html
          sed -i 's#../research-hub/#../#g' _site/bigpeng-hot-gzh/index.html
          sed -i 's#../../studies/bigpeng-hot-gzh/#../studies/bigpeng-hot-gzh/#g' _site/bigpeng-hot-gzh/index.html
          sed -i 's#../research-hub/#../#g' _site/srt-whiteboard-animation/index.html
          sed -i 's#../../studies/srt-whiteboard-animation/#../studies/srt-whiteboard-animation/#g' _site/srt-whiteboard-animation/index.html
          sed -i 's#../research-hub/#../#g' _site/blobatar/index.html
          touch _site/.nojekyll

      - name: Upload static research labs
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
