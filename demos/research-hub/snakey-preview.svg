<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Snakey Locomotion 程序化蛇研究预览</title>
  <desc id="desc">深绿色程序化地形上，一条由截面构成的蛇沿琥珀色轨迹蜿蜒。</desc>
