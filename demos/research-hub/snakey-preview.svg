  <path d="M80 610C260 420 280 720 470 526S720 388 820 530s172 58 300-90" fill="none" stroke="#e5a956" stroke-width="4" stroke-dasharray="10 18"/>
  <path d="M92 596C260 443 305 690 474 512S708 405 825 512s174 45 288-82" fill="none" stroke="#152015" stroke-width="70" stroke-linecap="round" opacity=".8"/>
  <path d="M92 588C260 435 305 682 474 504S708 397 825 504s174 45 288-82" fill="none" stroke="url(#snake)" stroke-width="56" stroke-linecap="round"/>
  <g fill="none" stroke="#f4e6ad" stroke-opacity=".55">
